<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>On Air</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1c0f24">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* The speaker phone: the same panel, after dark. Big caption, readable at arm's length. */
    :root {
      --sky-high: #3a1a4a;
      --sky: #2a1236;
      --sky-low: #1c0f24;
      --dusk: #120a17;
    }
    .page { padding-top: 22px; }
    .sign { font-size: clamp(2.6rem, 13vw, 4rem); }
    .plate { width: min(100%, 260px); margin-top: 22px; margin-bottom: 26px; }
    .now {
      font-size: 1.6rem; line-height: 1.3; text-transform: uppercase; min-height: 7em; margin: 0 0 22px;
      padding: 16px; background: var(--caption); border: var(--line) solid var(--ink); box-shadow: 5px 5px 0 #000;
    }
    .now .stamp { color: var(--stamp); }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .controls .button { width: 100%; }
    .controls .wide { grid-column: 1 / -1; }
    .meta { color: #d9c9de; font-size: 1.05rem; margin-top: 16px; }
    .meta p { margin: 0 0 4px; }
    .toggle { display: flex; align-items: center; gap: 10px; text-transform: none; color: var(--on-sky); margin-top: 18px; }
    .toggle input { width: 22px; height: 22px; accent-color: var(--mustard); }
    :focus-visible { outline-color: var(--mustard); }
    .walk { margin-top: 30px; display: grid; gap: 12px; padding: 18px; background: var(--caption); border: var(--line) solid var(--ink); box-shadow: 5px 5px 0 #000; }
    .walk h2 { margin: 0; font-family: var(--sign); font-weight: 400; font-size: 1.7rem; line-height: 1; text-transform: uppercase; }
    .walk p { margin: 0; }
    .walk-note { color: var(--muted); }
    .walk-status { font-size: 1.15rem; }
    .walk .button { width: 100%; }
    .walk .button.on { background: var(--stamp); color: var(--paper); }
    .walk .button.armed { background: var(--stamp); color: var(--paper); }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="sign">On air<span class="trail">Plays the newest entries on a loop. Connect your speaker, then press start.</span></h1>

    <div class="plate"><canvas id="blot" role="img" aria-label="Inkblot that moves while an entry plays"></canvas></div>

    <p class="now" id="now" aria-live="polite">Waiting to start.</p>

    <div class="controls">
      <button class="button wide" id="start" type="button">Start the loop</button>
      <button class="button secondary" id="skip" type="button" disabled>Skip</button>
      <button class="button secondary" id="pause" type="button" disabled>Pause</button>
    </div>

    <label class="toggle"><input type="checkbox" id="awake" checked> Keep the screen on (turn brightness down to save battery)</label>

    <div class="meta">
      <p id="count">No entries loaded yet.</p>
      <p id="net"></p>
    </div>

    <section class="walk" aria-labelledby="walk-title">
      <h2 id="walk-title">The walk</h2>
      <p class="walk-note">Shares this phone's location so the archive map shows your trail and where each entry was written. Nothing is sent while it's off.</p>
      <label id="walk-pass-row">Admin password <input type="password" id="walk-pass" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
      <button class="button" id="walk-toggle" type="button">Start sharing my location</button>
      <p class="walk-status" id="walk-status" aria-live="polite">Not sharing.</p>
      <button class="button secondary" id="walk-clear" type="button">Clear the whole trail</button>
    </section>
  </main>

  <script type="module">
    import { createBlot } from './blot.js';

    const ROTATION_SIZE = 25;     // how many recent entries stay in the loop
    const GAP_MS = 3500;          // silence between entries
    const POLL_MS = 15000;        // how often to check for new entries

    const blot = createBlot(document.getElementById('blot'), { seed: 4242 });
    const audio = new Audio();
    audio.preload = 'auto';

    const nowEl = document.getElementById('now');
    const startBtn = document.getElementById('start');
    const skipBtn = document.getElementById('skip');
    const pauseBtn = document.getElementById('pause');
    const countEl = document.getElementById('count');
    const netEl = document.getElementById('net');

    let rotation = [];            // newest first, audio entries only
    const known = new Set();      // ids we've seen
    const fresh = [];             // brand-new entries jump the queue
    const cache = new Map();      // id → blob: URL, so the loop survives bad signal
    let idx = 0, running = false, paused = false, gapTimer = 0, flutter = 0, wakeLock = null;

    async function cacheAudio(e) {
      if (cache.has(e.id)) return;
      try {
        const r = await fetch(e.audioUrl);
        if (!r.ok) throw 0;
        cache.set(e.id, URL.createObjectURL(await r.blob()));
      } catch {
        cache.set(e.id, e.audioUrl);   // fall back to streaming it
      }
    }

    async function poll(first = false) {
      try {
        const r = await fetch('/api/entries?limit=' + ROTATION_SIZE, { cache: 'no-store' });
        const { entries = [] } = await r.json();
        const withAudio = entries.filter((e) => e.audioUrl);
        for (const e of withAudio.slice().reverse()) {
          if (!known.has(e.id)) {
            known.add(e.id);
            if (!first) fresh.push(e);
          }
        }
        // Entries hidden by the admin drop out of the loop.
        const live = new Set(withAudio.map((e) => e.id));
        for (let i = fresh.length - 1; i >= 0; i--) if (!live.has(fresh[i].id)) fresh.splice(i, 1);
        rotation = withAudio;
        await Promise.all(withAudio.map(cacheAudio));
        countEl.textContent = `${rotation.length} ${rotation.length === 1 ? 'entry' : 'entries'} in the loop. ${fresh.length ? fresh.length + ' new waiting.' : ''}`;
        netEl.textContent = `Last checked ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}.`;
      } catch {
        netEl.textContent = 'No signal. Replaying saved entries until it comes back.';
      }
    }

    function nextEntry() {
      if (fresh.length) return fresh.shift();
      if (!rotation.length) return null;
      const e = rotation[idx % rotation.length];
      idx++;
      return e;
    }

    function show(e) {
      nowEl.innerHTML = '';
      const s = document.createElement('span');
      s.className = 'stamp';
      s.textContent = e.stamp + ' ';
      nowEl.append(s, document.createTextNode(e.line));
    }

    function playNext() {
      clearTimeout(gapTimer);
      if (!running || paused) return;
      const e = nextEntry();
      if (!e) {
        nowEl.textContent = 'No entries yet. Waiting for the first one…';
        gapTimer = setTimeout(playNext, 5000);
        return;
      }
      show(e);
      audio.src = cache.get(e.id) || e.audioUrl;
      audio.play().catch(() => { gapTimer = setTimeout(playNext, GAP_MS); });
    }

    audio.addEventListener('playing', () => {
      cancelAnimationFrame(flutter);
      const t0 = performance.now();
      const tick = (now) => {
        const t = (now - t0) / 1000;
        blot.setEnergy(0.35 + 0.3 * Math.abs(Math.sin(t * 5.3) * Math.sin(t * 2.1 + 1)));
        flutter = requestAnimationFrame(tick);
      };
      flutter = requestAnimationFrame(tick);
    });
    const calm = () => { cancelAnimationFrame(flutter); blot.setEnergy(0); };
    audio.addEventListener('pause', calm);
    audio.addEventListener('ended', () => { calm(); gapTimer = setTimeout(playNext, GAP_MS); });
    audio.addEventListener('error', () => { calm(); gapTimer = setTimeout(playNext, GAP_MS); });

    async function keepAwake(on) {
      try {
        if (on && 'wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } else if (!on && wakeLock) {
          await wakeLock.release();
        }
      } catch {}
    }
    document.getElementById('awake').addEventListener('change', (e) => keepAwake(e.target.checked));
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && running && document.getElementById('awake').checked) keepAwake(true);
    });

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Loading entries…';
      await poll(true);
      running = true;
      startBtn.hidden = true;
      skipBtn.disabled = false;
      pauseBtn.disabled = false;
      keepAwake(document.getElementById('awake').checked);
      setInterval(poll, POLL_MS);
      playNext();
    });

    skipBtn.addEventListener('click', () => { audio.pause(); playNext(); });

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      if (paused) { clearTimeout(gapTimer); audio.pause(); }
      else if (audio.src && !audio.ended && audio.currentTime > 0) audio.play();
      else playNext();
    });
  </script>
  <script type="module">
    // The walk: records this phone's position while sharing is on and keeps
    // the server's copy of the trail up to date. The phone holds the whole
    // trail (saved in localStorage) and always uploads all of it.
    const KEY = 'rj-walk';
    const TOKEN_KEY = 'rj-admin-token';
    const MIN_GAP_MS = 15000;     // at most one point every 15 s
    const MIN_MOVE_M = 8;         // ...unless we've moved, keep one a minute
    const WORST_ACCURACY_M = 75;  // ignore fixes vaguer than this
    const UPLOAD_MS = 45000;
    const WRONG_PASSWORD = "The server didn't accept that password. Check for a capital letter, a space or an autocorrected word.";

    const $ = (id) => document.getElementById(id);
    const toggle = $('walk-toggle'), statusEl = $('walk-status'), clearBtn = $('walk-clear');

    let state = load();
    let token = read(TOKEN_KEY) || '';
    let watchId = null, dirty = false, lastFix = null, problem = '', wakeLock = null;

    function read(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function write(k, v) { try { localStorage.setItem(k, v); } catch {} }
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || { sharing: false, seg: 0, points: [] }; }
      catch { return { sharing: false, seg: 0, points: [] }; }
    }
    function save() { write(KEY, JSON.stringify(state)); }

    function meters(p, lat, lng) {
      const k = 111320;
      const dx = (lng - p[2]) * k * Math.cos((lat * Math.PI) / 180);
      const dy = (lat - p[1]) * k;
      return Math.hypot(dx, dy);
    }

    function record(pos) {
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      const t = pos.timestamp || Date.now();
      lastFix = { t: Date.now(), accuracy };
      problem = '';
      if (accuracy <= WORST_ACCURACY_M) {
        const prev = state.points[state.points.length - 1];
        const fresh = !prev || prev[3] !== state.seg;
        const dt = fresh ? Infinity : t - prev[0];
        if (fresh || (dt >= MIN_GAP_MS && (meters(prev, lat, lng) >= MIN_MOVE_M || dt >= 60000))) {
          state.points.push([t, lat, lng, state.seg]);
          save();
          dirty = true;
        }
      }
      render();
    }

    function gpsError(err) {
      problem = err.code === 1
        ? 'Location permission is off for this site. Turn it on in your browser settings, then press start again.'
        : 'Waiting for a GPS signal…';
      if (err.code === 1) stop();
      render();
    }

    async function upload() {
      dirty = false;
      try {
        const r = await fetch('/api/trail', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
          body: JSON.stringify({ sharing: state.sharing, points: state.points }),
        });
        if (r.status === 401) { forgetToken(); stop(false); problem = WRONG_PASSWORD; render(); return false; }
        if (!r.ok) throw 0;
        return true;
      } catch {
        dirty = true;   // try again next round
        return false;
      }
    }

    function forgetToken() {
      token = '';
      try { localStorage.removeItem(TOKEN_KEY); } catch {}
      $('walk-pass-row').hidden = false;
    }

    async function mergeServerTrail() {
      try {
        const { points = [] } = await (await fetch('/api/trail', { cache: 'no-store' })).json();
        const seen = new Set(state.points.map((p) => p[0]));
        state.points = state.points.concat(points.filter((p) => !seen.has(p[0]))).sort((a, b) => a[0] - b[0]);
      } catch {}
    }

    function watch() {
      if (!('geolocation' in navigator)) { problem = 'This browser has no location access.'; render(); return; }
      watchId = navigator.geolocation.watchPosition(record, gpsError, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
      keepAwake(true);
    }

    async function start() {
      if (!token) {
        token = $('walk-pass').value.trim();
        if (!token) { problem = 'Enter the admin password first.'; render(); return; }
      }
      toggle.disabled = true;
      problem = '';
      await mergeServerTrail();
      state.sharing = true;
      state.seg = Date.now();
      save();
      const ok = await upload();
      toggle.disabled = false;
      if (!state.sharing) return;           // wrong password
      if (ok) { write(TOKEN_KEY, token); $('walk-pass-row').hidden = true; }
      watch();
      render();
    }

    function stop(send = true) {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      state.sharing = false;
      save();
      keepAwake(false);
      if (send) upload();
      render();
    }

    async function keepAwake(on) {
      try {
        if (on && 'wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } else if (!on && wakeLock) {
          await wakeLock.release();
        }
      } catch {}
    }

    function render() {
      const n = state.points.length;
      const trail = `${n} ${n === 1 ? 'point' : 'points'} on the trail.`;
      toggle.textContent = state.sharing ? 'Stop sharing my location' : 'Start sharing my location';
      toggle.classList.toggle('on', state.sharing);
      if (problem) statusEl.textContent = problem;
      else if (!state.sharing) statusEl.textContent = `Not sharing. ${trail}`;
      else if (!lastFix) statusEl.textContent = `Sharing. Waiting for a GPS fix… ${trail}`;
      else {
        const ago = Math.round((Date.now() - lastFix.t) / 1000);
        statusEl.textContent = `Sharing. Last fix ${ago}s ago (±${Math.round(lastFix.accuracy)} m). ${trail}`;
      }
    }

    toggle.addEventListener('click', () => (state.sharing ? stop() : start()));

    // Two taps: the first arms it, the second clears the trail here and on the map.
    let armed = 0;
    clearBtn.addEventListener('click', async () => {
      if (!armed) {
        clearBtn.textContent = 'Really clear the trail?';
        clearBtn.classList.add('armed');
        armed = setTimeout(() => { armed = 0; clearBtn.textContent = 'Clear the whole trail'; clearBtn.classList.remove('armed'); }, 4000);
        return;
      }
      clearTimeout(armed);
      armed = 0;
      clearBtn.classList.remove('armed');
      clearBtn.textContent = 'Clear the whole trail';
      if (!token) token = $('walk-pass').value.trim();
      if (!token) { problem = 'Enter the admin password first.'; render(); return; }
      const r = await fetch('/api/trail', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
        body: JSON.stringify({ clear: true }),
      }).catch(() => null);
      if (r?.status === 401) { forgetToken(); problem = WRONG_PASSWORD; }
      else if (!r?.ok) problem = 'Could not reach the server. Try again.';
      else { problem = ''; state.points = []; state.seg = Date.now(); save(); write(TOKEN_KEY, token); $('walk-pass-row').hidden = true; }
      render();
    });

    setInterval(() => { if (dirty && token) upload(); render(); }, UPLOAD_MS);
    setInterval(render, 5000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (state.sharing) { keepAwake(true); if (dirty) upload(); }
    });

    $('walk-pass-row').hidden = Boolean(token);
    // Sharing survives a reload: if it was on, pick up where it left off.
    if (state.sharing && token) { state.seg = Date.now(); save(); watch(); }
    render();
  </script>
</body>
</html>
